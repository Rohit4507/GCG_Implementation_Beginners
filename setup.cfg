[flake8]
# Deliberately narrow: this is a *dead code and typo* gate, not a formatter.
#
# The selection below (undefined names, unused imports, unused locals, syntax
# and indentation errors) is clean on the whole repo, so a failure here is a
# real regression rather than style noise. Line length and import-order rules
# are NOT enforced: existing modules have long HTML f-strings and deliberate
# `matplotlib.use("Agg")`-before-import ordering, and reformatting them would
# bury the actual findings in a whitespace diff.
extend-select = E9, F401, F811, F821, F841, W6
ignore = E501, E203, E266, W503, E402

max-line-length = 120

exclude =
    .git,
    .venv,
    venv,
    __pycache__,
    build,
    dist,
    experiments/attic,
