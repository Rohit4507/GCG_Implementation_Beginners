# Proves the pipeline works on a clean machine, so that nobody has to take a
# screenshot's word for it. CPU-only: the smoke test needs no GPU and downloads
# nothing (it builds its own tiny model and tokenizer offline).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # CPU torch wheels: ~200 MB instead of pulling the whole CUDA stack.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch \
            || pip install torch
          pip install -r requirements.txt

      # Undefined names, unused imports, unused locals, missing final newlines.
      # Deliberately narrow and currently clean repo-wide -- see setup.cfg. This
      # would have caught the dead `conditions` variable and the four unused
      # imports removed in the change that added it.
      - name: Lint (dead code / typo gate)
        run: |
          pip install flake8
          flake8 src experiments tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # A floor, not a target. Coverage was 81% when this was added and reached
      # the high 90s while pinning the behaviours the audit flagged; the number
      # here only has to stop it sliding back. Deliberately below the current
      # value so an unrelated refactor does not fail the build.
      - name: Coverage floor
        run: |
          pip install coverage
          python -m coverage run --source=src -m unittest discover -s tests
          python -m coverage report --fail-under=90

      # The README quotes its own test/check counts. Typed by hand, they drift
      # the moment a test is added, and this repo's whole claim is that its
      # numbers are checkable.
      - name: README counts match the code
        run: python -m experiments.check_docs_counts

      # The generated page and scorecards are committed artefacts. If a change
      # to src/judge.py thresholds moves any number on them, this step fails
      # instead of letting GitHub Pages keep publishing the old values.
      - name: Generated docs are in sync with the records
        run: |
          python -m experiments.rescore
          python -m experiments.build_report
          if ! git diff --quiet -- docs results/reports/scorecards; then
            echo "::error::docs/ or results/reports/scorecards/ is stale."
            git diff --stat -- docs results/reports/scorecards
            echo "Run: python -m experiments.rescore && python -m experiments.build_report"
            exit 1
          fi

      # The end-to-end validation, including the numerical proof that the
      # KV-cache matches a full forward pass.
      - name: Pipeline smoke test
        run: python -m experiments.run_smoke

      # The smoke test must leave a record that says what it actually ran on.
      - name: Smoke record has provenance
        run: |
          python - <<'PY'
          import json, sys
          rec = json.load(open("results/reports/smoke_results.json"))
          checks = rec.get("checks") or {}
          if len(checks) != 7:
              sys.exit(f"smoke_results.json has {len(checks)} checks, expected 7")
          failed = [k for k, v in checks.items() if not v.get("pass")]
          if failed:
              sys.exit(f"failed checks in smoke_results.json: {failed}")
          print("smoke record OK:", len(checks), "checks")
          PY

      # A real experiment runner, on the offline model, to catch breakage in the
      # argument parsing / record-writing paths that the smoke test does not
      # exercise. Results are intentionally meaningless here; the run only has to
      # complete and emit a record with provenance and accounting.
      - name: End-to-end runner check
        run: |
          set -e
          # Every runner gets one offline invocation. Only run_algorithm1 was
          # checked before, so a broken flag or record path in any other runner
          # reached main undetected.
          python -m experiments.run_algorithm1 --tiny --benchmark --steps 3 --num-prompts 2 --quiet
          python -m experiments.run_algorithm1 --tiny --benchmark --steps 1 --num-prompts 2 --per-prompt --quiet
          python -m experiments.run_algorithm2 --tiny --benchmark --steps 2 --num-prompts 3 --held-out 1 --quiet
          python -m experiments.run_control    --tiny --benchmark --num-prompts 2 --max-new-tokens 8 --skip-random
          python -m experiments.run_baselines  --tiny --benchmark --steps 2 --max-new-tokens 8
          python -m experiments.run_transfer   --tiny --benchmark --steps 2 --max-new-tokens 8
          python -m experiments.run_defense    --tiny --benchmark --steps 2
          python -m experiments.run_multiturn  --tiny --benchmark --steps 2 --max-new-tokens 8
          python -m experiments.run_seed_variance --seeds 3 --steps 2 --width 4
          python - <<'PY'
          import glob, json, sys

          paths = sorted(glob.glob("results/reports/generated/algorithm1_*.json"))
          if not paths:
              sys.exit("no run record was written")
          rec = json.load(open(paths[-1]))

          # A record that cannot say which model it used is not evidence.
          model = rec.get("model") or {}
          assert model.get("model_kind") == "tiny_random", model
          assert model.get("hf_model_id") is None, model

          acc = rec.get("accounting") or {}
          assert acc.get("total_forwards", 0) > 0, acc
          assert acc.get("cost_per_success_defined") is False, acc
          print("run record OK:", paths[-1])
          PY

      - name: Upload run records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-records
          path: results/reports/
          retention-days: 14
